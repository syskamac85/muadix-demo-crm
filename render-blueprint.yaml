# render.yaml – konfiguracja dla Render Blueprint
# Skopiuj tę zawartość do panelu Render: New > Blueprint > wklej YAML
# lub po prostu użyj jako przewodnik przy ręcznym tworzeniu serwisu

services:
  - type: web
    name: muadix-demo-crm-api
    env: python
    plan: free
    region: frankfurt
    branch: master
    autoDeploy: true
    buildCommand: >-
      pip install -r apps/api/requirements.txt &&
      cd apps/api &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput &&
      python manage.py setup_demo
    startCommand: >-
      cd apps/api && gunicorn api.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: api.settings
      - key: PYTHON_VERSION
        value: "3.12.2"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: muadix-demo-crm-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://muadix-demo-crm.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://muadix-demo-crm.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: CHANNEL_REDIS_URL
        sync: false
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      - key: REGON_API_KEY
        value: ""
      - key: REGON_API_URL
        value: https://wyszukiwarkaregon.stat.gov.pl/wsBIR/UslugaBIRzewnPubl.svc
