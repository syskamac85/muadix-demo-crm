# Fly.io configuration for the CRM demo backend
app = "muadix-demo-crm-api"
primary_region = "waw"

[build]
  dockerfile = "apps/api/Dockerfile"

[deploy]
  # Automatically run migrations on each deploy
  release_command = "python manage.py migrate"

[env]
  DJANGO_SETTINGS_MODULE = "api.settings"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory_mb = 512
  cpus = 1
