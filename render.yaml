services:
  - type: web
    name: muadix-demo-crm-api
    env: python
    plan: free
    region: frankfurt
    branch: master
    autoDeploy: true
    buildCommand: >-
      pip install -r apps/api/requirements.txt &&
      cd apps/api &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput &&
      python manage.py setup_demo
    startCommand: >-
      cd apps/api && python manage.py setup_demo --reset && daphne -b 0.0.0.0 -p $PORT api.asgi:application
    envVars:
      - fromGroup: muadix-demo-crm-backend

  - type: worker
    name: muadix-demo-crm-celery
    env: python
    plan: free
    region: frankfurt
    branch: master
    autoDeploy: true
    buildCommand: >-
      pip install -r apps/api/requirements.txt
    startCommand: >-
      cd apps/api && PYTHONPATH=. celery -A api worker -l info
    envVars:
      - fromGroup: muadix-demo-crm-backend

envVarGroups:
  - name: muadix-demo-crm-backend
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: api.settings
      - key: PYTHON_VERSION
        value: "3.12.2"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: muadix-demo-crm-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://muadix-demo-crm.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://muadix-demo-crm.vercel.app
      - key: DATABASE_URL
        value: postgresql://postgres.kjjkrlnrlcqfdsvezkjd:YOUR_SUPABASE_PASSWORD@aws-1-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require
      - key: CELERY_BROKER_URL
        value: rediss://default:YOUR_UPSTASH_TOKEN@proper-mite-48112.upstash.io:6379/0?ssl_cert_reqs=none
      - key: CELERY_RESULT_BACKEND
        value: rediss://default:YOUR_UPSTASH_TOKEN@proper-mite-48112.upstash.io:6379/0?ssl_cert_reqs=none
      - key: CHANNEL_REDIS_URL
        value: rediss://default:YOUR_UPSTASH_TOKEN@proper-mite-48112.upstash.io:6379/0?ssl_cert_reqs=none
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      - key: REGON_API_KEY
        value: ""
      - key: REGON_API_URL
        value: https://wyszukiwarkaregon.stat.gov.pl/wsBIR/UslugaBIRzewnPubl.svc
